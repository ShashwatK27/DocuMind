# DocuMind local stack: the API + a Qdrant server.
#
# Ollama is expected to run on the host (`ollama serve`, default port 11434) so
# the model stays on your machine and GPU — the app reaches it through
# host.docker.internal. Bring everything up with:  docker compose up --build
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      # Talk to the Qdrant service instead of a local on-disk store.
      DOCUMIND_QDRANT_URL: http://qdrant:6333
      # Reach Ollama running on the host machine.
      DOCUMIND_OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Cache downloaded models across restarts.
      - hf_cache:/models

volumes:
  qdrant_data:
  hf_cache:
